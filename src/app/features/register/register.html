<div class="mx-auto flex max-w-md flex-col px-4 py-10 sm:px-6 sm:py-16">
  <div>
    <h1 class="text-xl font-semibold text-slate-900">Buat Akun</h1>
    <p class="mt-1 text-sm text-slate-500">Daftar untuk mulai memesan tiket di Fayrly.</p>
  </div>

  <form
    #authForm
    class="mt-6 rounded-2xl border border-slate-100 bg-white p-5 shadow-card"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
  >
    @if (serverError()) {
      <div
        class="mb-4 rounded-xl border border-crimson-100 bg-crimson-50 px-3.5 py-3 text-sm text-crimson-700"
        role="alert"
      >
        {{ serverError() }}
      </div>
    }

    <label class="block">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">Nama lengkap</span>
      <input
        type="text"
        name="name"
        formControlName="name"
        class="field"
        placeholder="Nama kamu"
        autocomplete="name"
        [disabled]="loading()"
        [attr.aria-invalid]="nameError() ? 'true' : null"
        [attr.aria-describedby]="nameError() ? 'register-name-error' : null"
        (blur)="trim('name')"
        required
      />
      @if (nameError()) {
        <p id="register-name-error" class="mt-1.5 text-xs text-crimson-700">{{ nameError() }}</p>
      }
    </label>

    <label class="mt-4 block">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">Email</span>
      <input
        type="email"
        name="email"
        formControlName="email"
        class="field"
        placeholder="nama@email.com"
        autocomplete="email"
        inputmode="email"
        [disabled]="loading()"
        [attr.aria-invalid]="emailError() ? 'true' : null"
        [attr.aria-describedby]="emailError() ? 'register-email-error' : null"
        (blur)="trim('email')"
        required
      />
      @if (emailError()) {
        <p id="register-email-error" class="mt-1.5 text-xs text-crimson-700">{{ emailError() }}</p>
      }
    </label>

    <label class="mt-4 block">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">
        Nomor telepon <span class="font-normal text-slate-400">(opsional)</span>
      </span>
      <input
        type="tel"
        name="phone"
        formControlName="phone"
        class="field"
        placeholder="0812xxxxxxx"
        autocomplete="tel"
        inputmode="tel"
        [disabled]="loading()"
        [attr.aria-invalid]="phoneError() ? 'true' : null"
        [attr.aria-describedby]="phoneError() ? 'register-phone-error' : null"
        (blur)="trim('phone')"
      />
      @if (phoneError()) {
        <p id="register-phone-error" class="mt-1.5 text-xs text-crimson-700">{{ phoneError() }}</p>
      }
    </label>

    <label class="mt-4 block">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">Kata sandi</span>
      <div class="relative">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          formControlName="password"
          class="field pr-12"
          placeholder="Minimal 8 karakter"
          autocomplete="new-password"
          [disabled]="loading()"
          [attr.aria-invalid]="passwordError() ? 'true' : null"
          [attr.aria-describedby]="passwordError() ? 'register-password-error' : null"
          required
        />
        <button
          type="button"
          class="absolute right-0 top-0 flex h-11 w-11 items-center justify-center rounded-r-xl text-slate-500 hover:text-mint-800"
          [attr.aria-label]="showPassword() ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePassword()"
        >
          <lucide-icon
            [name]="showPassword() ? 'eye-off' : 'eye'"
            class="h-4 w-4"
            aria-hidden="true"
          />
        </button>
      </div>
      @if (passwordError()) {
        <p id="register-password-error" class="mt-1.5 text-xs text-crimson-700">
          {{ passwordError() }}
        </p>
      }
    </label>

    <label class="mt-4 block">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">Konfirmasi kata sandi</span>
      <div class="relative">
        <input
          [type]="showConfirmation() ? 'text' : 'password'"
          name="confirm_password"
          formControlName="confirmPassword"
          class="field pr-12"
          placeholder="Ulangi kata sandi"
          autocomplete="new-password"
          [disabled]="loading()"
          [attr.aria-invalid]="confirmationError() ? 'true' : null"
          [attr.aria-describedby]="confirmationError() ? 'register-confirmation-error' : null"
          required
        />
        <button
          type="button"
          class="absolute right-0 top-0 flex h-11 w-11 items-center justify-center rounded-r-xl text-slate-500 hover:text-mint-800"
          [attr.aria-label]="
            showConfirmation()
              ? 'Sembunyikan konfirmasi kata sandi'
              : 'Tampilkan konfirmasi kata sandi'
          "
          [attr.aria-pressed]="showConfirmation()"
          (click)="toggleConfirmation()"
        >
          <lucide-icon
            [name]="showConfirmation() ? 'eye-off' : 'eye'"
            class="h-4 w-4"
            aria-hidden="true"
          />
        </button>
      </div>
      @if (confirmationError()) {
        <p id="register-confirmation-error" class="mt-1.5 text-xs text-crimson-700">
          {{ confirmationError() }}
        </p>
      }
    </label>

    <button type="submit" class="btn-primary mt-6 w-full" [disabled]="loading()">
      @if (loading()) {
        <lucide-icon name="loader-circle" class="h-4 w-4 animate-spin" aria-hidden="true" />
        Memproses…
      } @else {
        Daftar
      }
    </button>

    <div class="mt-6 flex items-center gap-3" aria-hidden="true">
      <span class="h-px flex-1 bg-slate-200"></span>
      <span class="text-xs font-medium text-slate-400">atau</span>
      <span class="h-px flex-1 bg-slate-200"></span>
    </div>

    <div class="mt-4 grid gap-3">
      <button
        type="button"
        class="inline-flex h-11 w-full items-center justify-center gap-2.5 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-700 transition-colors duration-150 hover:border-slate-300 hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-mint-600 disabled:cursor-not-allowed disabled:text-slate-400"
        (click)="oauth('Google')"
        [disabled]="loading() || oauthProvider() !== null"
        [attr.aria-busy]="oauthProvider() === 'Google'"
      >
        @if (oauthProvider() === 'Google') {
          <lucide-icon name="loader-circle" class="h-4 w-4 animate-spin" aria-hidden="true" />
        } @else {
          <svg class="h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.54 5.54 0 0 1-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"
            />
            <path
              fill="#34A853"
              d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09A11.99 11.99 0 0 0 12 24z"
            />
            <path
              fill="#FBBC05"
              d="M5.27 14.29A7.2 7.2 0 0 1 4.89 12c0-.8.14-1.57.38-2.29V6.62H1.29A11.99 11.99 0 0 0 0 12c0 1.94.46 3.77 1.29 5.38l3.98-3.09z"
            />
            <path
              fill="#EA4335"
              d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"
            />
          </svg>
        }
        Lanjut dengan Google
      </button>

      <button
        type="button"
        class="inline-flex h-11 w-full items-center justify-center gap-2.5 rounded-xl bg-slate-900 text-sm font-semibold text-white transition-colors duration-150 hover:bg-black focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 disabled:cursor-not-allowed disabled:bg-slate-400"
        (click)="oauth('Apple')"
        [disabled]="loading() || oauthProvider() !== null"
        [attr.aria-busy]="oauthProvider() === 'Apple'"
      >
        @if (oauthProvider() === 'Apple') {
          <lucide-icon name="loader-circle" class="h-4 w-4 animate-spin" aria-hidden="true" />
        } @else {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M16.37 12.79c-.02-2.03 1.66-3.01 1.74-3.06-.95-1.39-2.42-1.58-2.94-1.6-1.25-.13-2.44.74-3.08.74-.63 0-1.62-.72-2.66-.7-1.37.02-2.63.8-3.33 2.02-1.42 2.47-.36 6.12 1.02 8.12.68.98 1.48 2.08 2.54 2.04 1.02-.04 1.4-.66 2.64-.66 1.22 0 1.58.66 2.65.64 1.1-.02 1.79-.99 2.46-1.98.78-1.13 1.1-2.23 1.12-2.29-.03-.01-2.14-.82-2.16-3.23zM14.4 6.66c.56-.68.94-1.63.84-2.57-.81.03-1.79.54-2.37 1.21-.52.6-.97 1.56-.85 2.48.9.07 1.82-.46 2.38-1.12z"
            />
          </svg>
        }
        Lanjut dengan Apple
      </button>
    </div>
  </form>

  <div class="mt-5 flex flex-col gap-1">
    <p class="text-sm text-slate-500">
      Sudah punya akun?
      <a
        routerLink="/masuk"
        [queryParams]="returnUrl ? { returnUrl } : {}"
        class="font-medium text-mint-700 hover:text-mint-800"
      >
        Masuk
      </a>
    </p>
    <a
      routerLink="/"
      class="inline-flex min-h-11 items-center text-sm font-medium text-slate-500 hover:text-mint-700"
    >
      Kembali ke beranda
    </a>
  </div>
</div>
