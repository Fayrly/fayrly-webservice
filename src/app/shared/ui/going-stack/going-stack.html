@if (count() > 0) {
  <div class="flex min-w-0 items-center gap-2">
    <div class="flex shrink-0 -space-x-2" aria-hidden="true">
      @for (name of visible(); track $index) {
        <span
          class="flex items-center justify-center rounded-full font-semibold ring-2 ring-white"
          [class]="
            (compact() ? 'h-6 w-6 text-[9px]' : 'h-8 w-8 text-[10px]') +
            ' ' +
            avatarStyle($index)
          "
          [attr.title]="name"
        >
          {{ avatarInitials(name) }}
        </span>
      }

      @if (visible().length === 0) {
        <span
          class="flex items-center justify-center rounded-full bg-mint-100 text-mint-800 ring-2 ring-white"
          [class]="compact() ? 'h-6 w-6' : 'h-8 w-8'"
        >
          <lucide-icon name="users" [class]="compact() ? 'h-3 w-3' : 'h-3.5 w-3.5'" aria-hidden="true" />
        </span>
      }

      @if (remaining() > 0) {
        <span
          class="flex items-center justify-center rounded-full bg-slate-100 font-semibold text-slate-600 ring-2 ring-white"
          [class]="compact() ? 'h-6 min-w-6 px-1 text-[9px]' : 'h-8 min-w-8 px-1.5 text-[10px]'"
        >
          +{{ remaining() > 99 ? '99' : remaining() }}
        </span>
      }
    </div>

    @if (showLabel()) {
      <span class="min-w-0 truncate text-xs text-slate-500">
        <span class="font-semibold text-slate-700">{{ count() }}</span>
        {{ compact() ? 'ikut' : 'orang akan hadir' }}
      </span>
    }
  </div>
}
